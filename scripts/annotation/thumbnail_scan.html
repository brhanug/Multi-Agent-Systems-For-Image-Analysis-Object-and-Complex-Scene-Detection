<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thumbnail Scan</title>
<style>
:root {
  --ground: #f6f5f1; --panel: #ffffff; --ink: #1f2420; --muted: #636b64; --line: #d9dbd3;
  --accent: #2f6b4f; --accent-soft: #dcebe2; --warn: #9a5b00; --warn-soft: #fbecd2;
  --hit-ring: #2f6b4f;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #151816; --panel: #1d211e; --ink: #e7ebe6; --muted: #9aa49b; --line: #323833;
    --accent: #7cc39b; --accent-soft: #23362b; --warn: #f0b45a; --warn-soft: #3a2d17; --hit-ring: #7cc39b;
  }
}
:root[data-theme="dark"] {
  --ground: #151816; --panel: #1d211e; --ink: #e7ebe6; --muted: #9aa49b; --line: #323833;
  --accent: #7cc39b; --accent-soft: #23362b; --warn: #f0b45a; --warn-soft: #3a2d17; --hit-ring: #7cc39b;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--ground); color: var(--ink);
  font: 14px/1.45 "Source Sans 3", "Segoe UI", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
h1 { font-size: 16px; margin: 0; letter-spacing: .02em; }
.group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
button.chip { border: 1px solid var(--line); background: var(--ground); color: var(--ink); border-radius: 999px;
  padding: 4px 11px; font: inherit; cursor: pointer; }
button.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
button.chip small { color: inherit; opacity: .75; font-variant-numeric: tabular-nums; }
button:focus-visible, .tile:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
main { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 16px; }
@media (min-width: 1100px) { main { grid-template-columns: 1fr 420px; } }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; align-content: start; }
.tile { position: relative; background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 4px; }
.tile img { max-width: 100%; max-height: 100%; display: block; }
.tile.hit { border: 3px solid var(--hit-ring); background: var(--accent-soft); padding: 2px; }
.tile.hit::after { content: "✓"; position: absolute; top: 4px; right: 6px; font-weight: 700; color: var(--accent); }
.tile .zoom { position: absolute; left: 4px; bottom: 4px; border: 0; border-radius: 3px; background: var(--panel);
  color: var(--muted); font-size: 12px; padding: 1px 5px; cursor: zoom-in; opacity: .9; }
aside { position: sticky; top: 76px; align-self: start; display: none; }
@media (min-width: 1100px) { aside { display: block; } }
aside .preview { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; min-height: 420px;
  display: flex; align-items: center; justify-content: center; padding: 8px; }
aside .preview img { max-width: 100%; max-height: 70vh; }
aside p { color: var(--muted); font-size: 13px; margin: 8px 0 0; }
footer { position: sticky; bottom: 0; background: var(--panel); border-top: 1px solid var(--line);
  padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.stat { font-variant-numeric: tabular-nums; }
.notice { background: var(--warn-soft); color: var(--warn); border-radius: 4px; padding: 4px 10px; display: none; }
.notice.on { display: inline-block; }
button.primary { margin-left: auto; background: var(--accent); color: var(--panel); border: 0; border-radius: 4px;
  padding: 8px 16px; font: inherit; font-weight: 600; cursor: pointer; }
button.primary:disabled { opacity: .5; cursor: wait; }
dialog { border: 1px solid var(--line); background: var(--panel); color: var(--ink); padding: 8px; max-width: 95vw; }
dialog img { max-width: 92vw; max-height: 85vh; display: block; }
.help { color: var(--muted); font-size: 13px; }
kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>Thumbnail scan</h1>
  <div class="group" role="group" aria-label="Target"><span class="label">Find</span><span id="targets"></span></div>
  <div class="group" role="group" aria-label="Order"><span class="label">Order</span>
    <button class="chip" data-order="ranked" aria-pressed="true">ranked</button>
    <button class="chip" data-order="random" aria-pressed="false">random check</button>
  </div>
  <span class="help">Click every picture that shows the target. <kbd>Enter</kbd> saves the screen and loads the next.</span>
</header>
<main>
  <section class="grid" id="grid" aria-live="polite"></section>
  <aside><div class="preview" id="preview"><span class="help">Hover a picture to see it large.</span></div>
    <p id="previewId"></p></aside>
</main>
<footer>
  <span class="stat" id="where"></span>
  <span class="stat" id="totals"></span>
  <span class="notice" id="stop">Two screens in a row without a hit: you can stop this target.</span>
  <button class="primary" id="next">Save screen and next</button>
</footer>
<dialog id="big"><img alt=""><form method="dialog"><button class="chip">Close</button></form></dialog>
<script>
const state = { target: null, order: "ranked", items: [], hits: new Set(), screen: 1, started: 0, targets: [] };
const $ = s => document.querySelector(s);

async function loadTargets() {
  const d = await (await fetch("/api/targets")).json();
  state.targets = d.targets;
  const names = [...new Set(d.targets.map(t => t.target))];
  if (!state.target) state.target = names[0];
  $("#targets").innerHTML = names.map(n => {
    const t = d.targets.find(x => x.target === n && x.order === state.order);
    return `<button class="chip" data-target="${n}" aria-pressed="${n === state.target}">${n} <small>${t.hits}/${t.shown}</small></button>`;
  }).join(" ");
  const t = d.targets.find(x => x.target === state.target && x.order === state.order);
  $("#totals").textContent = `${state.target}, ${state.order}: ${t.hits} hits in ${t.shown} pictures, ${t.screens} screens, ${t.minutes} min`;
}

async function loadScreen() {
  const q = new URLSearchParams({ target: state.target, order: state.order, n: 60 });
  const d = await (await fetch("/api/screen?" + q)).json();
  state.items = d.items; state.hits = new Set(); state.screen = d.screen; state.started = performance.now();
  $("#stop").classList.toggle("on", state.order === "ranked" && d.dry_screens >= 2);
  $("#where").textContent = `Screen ${d.screen}` + (d.items.length ? `, pictures ${d.items[0].position}–${d.items.at(-1).position}` : ", nothing left");
  $("#grid").innerHTML = d.items.map(it =>
    `<div class="tile" tabindex="0" data-id="${it.id}" role="checkbox" aria-checked="false" aria-label="picture ${it.position}">
       <img loading="lazy" src="/img/${encodeURIComponent(it.id)}?s=t" alt="">
       <button class="zoom" data-zoom="${it.id}" aria-label="enlarge">⤢</button></div>`).join("");
  window.scrollTo(0, 0);
}

$("#grid").addEventListener("click", e => {
  const z = e.target.closest("[data-zoom]");
  if (z) { e.stopPropagation(); $("#big img").src = `/img/${encodeURIComponent(z.dataset.zoom)}?s=l`; $("#big").showModal(); return; }
  const t = e.target.closest(".tile"); if (!t) return;
  const id = t.dataset.id; state.hits.has(id) ? state.hits.delete(id) : state.hits.add(id);
  t.classList.toggle("hit"); t.setAttribute("aria-checked", state.hits.has(id));
});
$("#grid").addEventListener("keydown", e => { if (e.key === " " && e.target.classList.contains("tile")) { e.preventDefault(); e.target.click(); } });
$("#grid").addEventListener("mouseover", e => {
  const t = e.target.closest(".tile"); if (!t) return;
  $("#preview").innerHTML = `<img src="/img/${encodeURIComponent(t.dataset.id)}?s=l" alt="">`;
  $("#previewId").textContent = t.dataset.id;
});

async function next() {
  if (!state.items.length) return;
  $("#next").disabled = true;
  const seconds = (performance.now() - state.started) / 1000;
  await fetch("/api/save", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ target: state.target, order: state.order, screen: state.screen, seconds,
      items: state.items.map(it => ({ id: it.id, position: it.position, hit: state.hits.has(it.id) })) }) });
  await loadTargets(); await loadScreen(); $("#next").disabled = false;
}
$("#next").addEventListener("click", next);
document.addEventListener("keydown", e => { if (e.key === "Enter" && !$("#big").open) { e.preventDefault(); next(); } });

document.querySelector("header").addEventListener("click", async e => {
  const t = e.target.closest("[data-target]"), o = e.target.closest("[data-order]");
  if (!t && !o) return;
  if (state.hits.size && !confirm("This screen has unsaved clicks. Switch anyway?")) return;
  if (t) state.target = t.dataset.target;
  if (o) { state.order = o.dataset.order;
    document.querySelectorAll("[data-order]").forEach(b => b.setAttribute("aria-pressed", b.dataset.order === state.order)); }
  await loadTargets(); await loadScreen();
});

loadTargets().then(loadScreen);
</script>
</body>
</html>
